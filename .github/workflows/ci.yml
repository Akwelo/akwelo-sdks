name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  react-native:
    name: React Native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The oldest dependency versions pubspec.yaml allows must work too.
      - name: Oldest allowed dependencies
        run: flutter pub downgrade && flutter analyze && flutter test

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Unit tests and lint
        run: gradle :akwelo:testDebugUnitTest :akwelo:lintDebug

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The capture screen (UIKit, WebKit) only compiles against the iOS SDK.
      - name: Build for the iOS Simulator
        run: xcodebuild build -scheme Akwelo -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation
      # Result parsing, URL rules and timeouts are Foundation only and run on the Mac itself.
      - name: Logic tests
        run: swift test
